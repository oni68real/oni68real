<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05060a"/><stop offset="1" stop-color="#11131c"/>
    </linearGradient>
    <linearGradient id="split" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2e4d"/><stop offset="0.5" stop-color="#ff2e4d"/>
      <stop offset="0.5" stop-color="#22e4ff"/><stop offset="1" stop-color="#22e4ff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <circle cx="120" cy="60" r="160" fill="#ff2e4d" opacity="0.12"><animate attributeName="r" values="150;180;150" dur="6s" repeatCount="indefinite"/></circle>
  <circle cx="1080" cy="240" r="170" fill="#22e4ff" opacity="0.12"><animate attributeName="r" values="180;150;180" dur="6s" repeatCount="indefinite"/></circle>
  <g fill="#ffffff" opacity="0.5">
    <circle cx="300" cy="50" r="1.5"><animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="70" r="1.5"><animate attributeName="opacity" values="1;0;1" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="650" cy="260" r="1.5"><animate attributeName="opacity" values="0;1;0" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="200" cy="230" r="1.5"><animate attributeName="opacity" values="1;0;1" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="1000" cy="40" r="1.5"><animate attributeName="opacity" values="0;1;0" dur="4.5s" repeatCount="indefinite"/></circle>
  </g>
  <text x="600" y="165" text-anchor="middle" font-family="Segoe UI, Arial Black, sans-serif" font-weight="900" font-size="110" fill="url(#split)" filter="url(#glow)" letter-spacing="6">oni68</text>
  <text x="600" y="215" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#c9d1d9" letter-spacing="4">GAMING CREATOR · WEB BUILDER · FUTURE AI DEV</text>
  <rect x="450" y="240" width="300" height="4" rx="2" fill="url(#split)"><animate attributeName="width" values="0;300;300" dur="2s" fill="freeze"/></rect>
</svg>
